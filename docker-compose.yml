name: frag-arc

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-frag-arc-production-auth-secret-change-me-in-dokploy-32chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/frag-arc}
      NEXT_PUBLIC_ARC_TESTNET_FACTORY: ${NEXT_PUBLIC_ARC_TESTNET_FACTORY:-0x364860b76927D48Fa5a855b5501B057C95d3F376}
      NEXT_PUBLIC_ARC_TESTNET_MOCK_NFT: ${NEXT_PUBLIC_ARC_TESTNET_MOCK_NFT:-0x789b783f982885994f5756C30e840a12Ec71d79B}
      NEXT_PUBLIC_ARC_MAINNET_FACTORY: ${NEXT_PUBLIC_ARC_MAINNET_FACTORY:-0x0000000000000000000000000000000000000000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
    init: true
    command: ["node", "/app/apps/web/migrate.mjs"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/frag-arc}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18
    container_name: frag-arc-postgres
    environment:
      POSTGRES_DB: frag-arc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - frag-arc_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  frag-arc_postgres_data:

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: .env
